<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 44 bis 50 SGB X: Rücknahme, Widerruf, Änderung und Erstattung</title><desc id="desc">Eine Bewilligung soll geändert oder eine Leistung zurückgefordert werden. Alten und neuen Bescheid samt Zugangsdaten sichern; Frist und Vollziehbarkeit der neuen Entscheidung sofort prüfen; Ursprünglichen Fehler oder spätere Änderung unterscheiden; Mitteilungen, Vertrauen und Berechnung mit Belegen prüfen; Rechtsbehelf und gesonderte Zahlungsfragen passend bearbeiten. Überprüfung, Ratenbitte und Beratung ersetzen keinen fristgerechten Rechtsbehelf; Vertrauensschutz ist nicht automatisch gegeben.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 64 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 44 bis 50 SGB X</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Rücknahme, Widerruf, Änderung und Erstattung</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine Bewilligung soll geändert oder eine Leistung zurückgefordert werden.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="510.0" r="30" fill="#142943"/><text x="122" y="521.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="500.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Alten und neuen Bescheid samt Zugangsdaten</text><text x="182" y="540.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">sichern</text><rect x="72" y="583" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="641.0" r="30" fill="#142943"/><text x="122" y="652.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="631.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Frist und Vollziehbarkeit der neuen Entscheidung</text><text x="182" y="671.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">sofort prüfen</text><rect x="72" y="714" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="772.0" r="30" fill="#142943"/><text x="122" y="783.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="762.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Ursprünglichen Fehler oder spätere Änderung</text><text x="182" y="802.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">unterscheiden</text><rect x="72" y="845" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="903.0" r="30" fill="#142943"/><text x="122" y="914.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="893.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Mitteilungen, Vertrauen und Berechnung mit</text><text x="182" y="933.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Belegen prüfen</text><rect x="72" y="976" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1034.0" r="30" fill="#142943"/><text x="122" y="1045.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1024.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Rechtsbehelf und gesonderte Zahlungsfragen</text><text x="182" y="1064.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">passend bearbeiten</text><rect x="72" y="1125" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1158" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1190" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Überprüfung, Ratenbitte und Beratung ersetzen keinen fristgerechten</text><text x="96" y="1226" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Rechtsbehelf; Vertrauensschutz ist nicht automatisch gegeben.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
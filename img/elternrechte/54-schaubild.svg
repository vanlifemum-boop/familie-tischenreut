<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 1696 BGB: Abänderung sorgerechtlicher und umgangsrechtlicher Entscheidungen</title><desc id="desc">Eine bestehende Sorge-, Umgangs- oder Schutzregelung soll geändert werden. Beschluss und noch laufende Rechtsmittelfrist prüfen; Variante des § 1696 Absatz 1, 2 oder 3 zuordnen; Frühere Annahmen mit aktuellen Tatsachen vergleichen; Gewünschte Änderung und Übergang konkret begründen; Antrag und nötigen vorläufigen Schutz klären. Ein Änderungsantrag setzt die bestehende Entscheidung nicht außer Kraft.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 54 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 1696 BGB</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Abänderung sorgerechtlicher und umgangsrechtlicher</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Entscheidungen</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine bestehende Sorge-, Umgangs- oder Schutzregelung soll geändert</text><text x="72" y="427" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">werden.</text><text x="72" y="491" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="534" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="592.0" r="30" fill="#142943"/><text x="122" y="603.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="582.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Beschluss und noch laufende Rechtsmittelfrist</text><text x="182" y="622.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="665" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="721.0" r="30" fill="#142943"/><text x="122" y="732.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="731.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Variante des § 1696 Absatz 1, 2 oder 3 zuordnen</text><rect x="72" y="792" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="850.0" r="30" fill="#142943"/><text x="122" y="861.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="840.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Frühere Annahmen mit aktuellen Tatsachen</text><text x="182" y="880.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">vergleichen</text><rect x="72" y="923" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="981.0" r="30" fill="#142943"/><text x="122" y="992.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="971.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Gewünschte Änderung und Übergang konkret</text><text x="182" y="1011.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">begründen</text><rect x="72" y="1054" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1110.0" r="30" fill="#142943"/><text x="122" y="1121.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1120.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Antrag und nötigen vorläufigen Schutz klären</text><rect x="72" y="1199" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1232" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1264" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Ein Änderungsantrag setzt die bestehende Entscheidung nicht außer Kraft.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 40, 42, 68 und 74 VwGO: Verwaltungsrechtsweg, Klagearten, Widerspruch und Klagefrist</title><desc id="desc">Eine Jugendamtsentscheidung soll überprüft oder eine Leistung erreicht werden. Bescheid, Belehrung und Zugang sofort sichern; Rechtsweg und eigenes konkretes Begehren klären; Vorverfahren anhand Sachgebiet und Landesrecht prüfen; Passenden Rechtsbehelf form- und fristgerecht einreichen; Bei Dringlichkeit parallel passenden Eilrechtsschutz prüfen. Beratungs- oder Sachstandsanfragen ersetzen weder Widerspruch noch Klage; Frist und Empfänger müssen zum Fall passen.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 68 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 40, 42, 68 und 74 VwGO</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Verwaltungsrechtsweg, Klagearten, Widerspruch und</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Klagefrist</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine Jugendamtsentscheidung soll überprüft oder eine Leistung erreicht</text><text x="72" y="427" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">werden.</text><text x="72" y="491" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="534" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="590.0" r="30" fill="#142943"/><text x="122" y="601.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="600.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bescheid, Belehrung und Zugang sofort sichern</text><rect x="72" y="661" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="717.0" r="30" fill="#142943"/><text x="122" y="728.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="727.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Rechtsweg und eigenes konkretes Begehren klären</text><rect x="72" y="788" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="846.0" r="30" fill="#142943"/><text x="122" y="857.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="836.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Vorverfahren anhand Sachgebiet und Landesrecht</text><text x="182" y="876.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="919" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="977.0" r="30" fill="#142943"/><text x="122" y="988.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="967.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Passenden Rechtsbehelf form- und fristgerecht</text><text x="182" y="1007.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">einreichen</text><rect x="72" y="1050" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1108.0" r="30" fill="#142943"/><text x="122" y="1119.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1098.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bei Dringlichkeit parallel passenden Eilrechtsschutz</text><text x="182" y="1138.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="1199" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1232" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1264" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Beratungs- oder Sachstandsanfragen ersetzen weder Widerspruch noch</text><text x="96" y="1300" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Klage; Frist und Empfänger müssen zum Fall passen.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
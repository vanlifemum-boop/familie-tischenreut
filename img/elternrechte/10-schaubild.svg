<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Art. 20 und 25 UN-KRK: Alternative Betreuung und regelmäßige Überprüfung</title><desc id="desc">Eine Unterbringung oder Betreuung dauert an. Aktuelle Entwicklung und Kindeswünsche erfassen; Eignung und Notwendigkeit der Hilfe prüfen; Kontakte und Betreuungsperspektive aktualisieren; Hilfeplan und gerichtliche Kontrolle unterscheiden; Änderung bei zuständiger Stelle anregen. Regelmäßige Überprüfung bedeutet keine automatische Rückkehr.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 10 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">Art. 20 und 25 UN-KRK</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Alternative Betreuung und regelmäßige Überprüfung</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine Unterbringung oder Betreuung dauert an.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="508.0" r="30" fill="#142943"/><text x="122" y="519.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="518.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Aktuelle Entwicklung und Kindeswünsche erfassen</text><rect x="72" y="579" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="635.0" r="30" fill="#142943"/><text x="122" y="646.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="645.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Eignung und Notwendigkeit der Hilfe prüfen</text><rect x="72" y="706" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="762.0" r="30" fill="#142943"/><text x="122" y="773.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="772.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kontakte und Betreuungsperspektive aktualisieren</text><rect x="72" y="833" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="889.0" r="30" fill="#142943"/><text x="122" y="900.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="899.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Hilfeplan und gerichtliche Kontrolle unterscheiden</text><rect x="72" y="960" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1016.0" r="30" fill="#142943"/><text x="122" y="1027.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1026.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Änderung bei zuständiger Stelle anregen</text><rect x="72" y="1105" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1138" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1170" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Regelmäßige Überprüfung bedeutet keine automatische Rückkehr.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
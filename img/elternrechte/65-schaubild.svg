<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 67a bis 69, 83 und 84 SGB X: Sozialdaten: Erhebung, Zweckbindung, Übermittlung und Betroffenenrechte</title><desc id="desc">Sozialdaten wurden möglicherweise falsch erhoben, genutzt oder übermittelt. Daten, verantwortliche Stelle und Vorgang genau benennen; Zweck und gesetzliche Grundlage der Verarbeitung klären; Auskunft über eigene Daten gezielt beantragen; Fehler belegen; bei Unklarheit Kennzeichnung prüfen lassen; Antwort prüfen und gegebenenfalls Datenschutzaufsicht anrufen. Nicht jede Verarbeitung braucht Einwilligung; das Bestreiten von Sozialdaten stoppt soziale Aufgaben nicht automatisch.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 65 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 67a bis 69, 83 und 84 SGB X</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Sozialdaten: Erhebung, Zweckbindung, Übermittlung</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">und Betroffenenrechte</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Sozialdaten wurden möglicherweise falsch erhoben, genutzt oder</text><text x="72" y="427" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">übermittelt.</text><text x="72" y="491" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="534" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="592.0" r="30" fill="#142943"/><text x="122" y="603.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="582.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Daten, verantwortliche Stelle und Vorgang genau</text><text x="182" y="622.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">benennen</text><rect x="72" y="665" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="723.0" r="30" fill="#142943"/><text x="122" y="734.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="713.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Zweck und gesetzliche Grundlage der Verarbeitung</text><text x="182" y="753.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">klären</text><rect x="72" y="796" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="852.0" r="30" fill="#142943"/><text x="122" y="863.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="862.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Auskunft über eigene Daten gezielt beantragen</text><rect x="72" y="923" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="981.0" r="30" fill="#142943"/><text x="122" y="992.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="971.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Fehler belegen; bei Unklarheit Kennzeichnung</text><text x="182" y="1011.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen lassen</text><rect x="72" y="1054" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1112.0" r="30" fill="#142943"/><text x="122" y="1123.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1102.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Antwort prüfen und gegebenenfalls</text><text x="182" y="1142.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Datenschutzaufsicht anrufen</text><rect x="72" y="1203" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1236" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1268" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Nicht jede Verarbeitung braucht Einwilligung; das Bestreiten von Sozialdaten</text><text x="96" y="1304" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">stoppt soziale Aufgaben nicht automatisch.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 76 und 81 FamFG: Verfahrenskostenhilfe und Kostenentscheidung</title><desc id="desc">Gerichts- oder Anwaltskosten können nicht aufgebracht werden. Verfahren und laufende Fristen bestimmen; Anliegen und Erfolgsaussichten nachvollziehbar darstellen; Amtliches Finanzformular und Belege vorbereiten; Benötigte anwaltliche Beiordnung ausdrücklich klären; Bewilligung, Kostenrisiken und Mitteilungen beachten. VKH beseitigt nicht jede Zahlungspflicht oder gegnerische Kostenerstattung.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 58 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 76 und 81 FamFG</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Verfahrenskostenhilfe und Kostenentscheidung</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Gerichts- oder Anwaltskosten können nicht aufgebracht werden.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="508.0" r="30" fill="#142943"/><text x="122" y="519.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="518.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Verfahren und laufende Fristen bestimmen</text><rect x="72" y="579" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="637.0" r="30" fill="#142943"/><text x="122" y="648.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="627.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Anliegen und Erfolgsaussichten nachvollziehbar</text><text x="182" y="667.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">darstellen</text><rect x="72" y="710" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="766.0" r="30" fill="#142943"/><text x="122" y="777.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="776.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Amtliches Finanzformular und Belege vorbereiten</text><rect x="72" y="837" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="895.0" r="30" fill="#142943"/><text x="122" y="906.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="885.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Benötigte anwaltliche Beiordnung ausdrücklich</text><text x="182" y="925.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">klären</text><rect x="72" y="968" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1026.0" r="30" fill="#142943"/><text x="122" y="1037.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1016.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bewilligung, Kostenrisiken und Mitteilungen</text><text x="182" y="1056.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">beachten</text><rect x="72" y="1117" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1150" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1182" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">VKH beseitigt nicht jede Zahlungspflicht oder gegnerische Kostenerstattung.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 16 bis 18 SGB VIII: Familienförderung, Trennungsberatung, Sorge und Umgang</title><desc id="desc">Familienalltag, Trennung oder Umgang benötigen Unterstützung. Anliegen: Förderung, Trennung oder Umgang einordnen; Passendes Angebot nach §§ 16 bis 18 anfragen; Kindesinteressen und besondere Schutzbedürfnisse benennen; Konkrete Ziele, Termine und Unterstützung besprechen; Gerichtliche Regelung und praktische Hilfe getrennt prüfen. Beratung ändert keinen Gerichtsbeschluss; gemeinsame Gespräche müssen bei Gewalt geeignet sein.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 25 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 16 bis 18 SGB VIII</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Familienförderung, Trennungsberatung, Sorge und</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Umgang</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Familienalltag, Trennung oder Umgang benötigen Unterstützung.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="554.0" r="30" fill="#142943"/><text x="122" y="565.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="544.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Anliegen: Förderung, Trennung oder Umgang</text><text x="182" y="584.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">einordnen</text><rect x="72" y="627" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="683.0" r="30" fill="#142943"/><text x="122" y="694.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="693.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Passendes Angebot nach §§ 16 bis 18 anfragen</text><rect x="72" y="754" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="812.0" r="30" fill="#142943"/><text x="122" y="823.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="802.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kindesinteressen und besondere Schutzbedürfnisse</text><text x="182" y="842.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">benennen</text><rect x="72" y="885" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="943.0" r="30" fill="#142943"/><text x="122" y="954.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="933.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Konkrete Ziele, Termine und Unterstützung</text><text x="182" y="973.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">besprechen</text><rect x="72" y="1016" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1074.0" r="30" fill="#142943"/><text x="122" y="1085.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1064.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Gerichtliche Regelung und praktische Hilfe getrennt</text><text x="182" y="1104.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="1165" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1198" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1230" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Beratung ändert keinen Gerichtsbeschluss; gemeinsame Gespräche müssen</text><text x="96" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">bei Gewalt geeignet sein.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
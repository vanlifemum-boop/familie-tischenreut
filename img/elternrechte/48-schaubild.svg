<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 1631 BGB: Inhalt der Personensorge und Recht auf gewaltfreie Erziehung</title><desc id="desc">Ein Kind braucht gewaltfreie Erziehung und sicheren Schutz. Bei akuter Gefahr sofort Schutz organisieren; Sorgebereich und konkrete Belastung feststellen; Beobachtungen ohne suggestive Befragung sichern; Passende Beratung und Entlastung anfragen; Bei Bedarf gerichtliche Schutzmaßnahmen prüfen. Erziehungs- und Aufsichtsrecht rechtfertigen keine Gewalt.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 48 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 1631 BGB</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Inhalt der Personensorge und Recht auf gewaltfreie</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Erziehung</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Ein Kind braucht gewaltfreie Erziehung und sicheren Schutz.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="552.0" r="30" fill="#142943"/><text x="122" y="563.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="562.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bei akuter Gefahr sofort Schutz organisieren</text><rect x="72" y="623" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="679.0" r="30" fill="#142943"/><text x="122" y="690.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="689.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Sorgebereich und konkrete Belastung feststellen</text><rect x="72" y="750" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="806.0" r="30" fill="#142943"/><text x="122" y="817.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="816.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Beobachtungen ohne suggestive Befragung sichern</text><rect x="72" y="877" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="933.0" r="30" fill="#142943"/><text x="122" y="944.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="943.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Passende Beratung und Entlastung anfragen</text><rect x="72" y="1004" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1060.0" r="30" fill="#142943"/><text x="122" y="1071.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1070.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bei Bedarf gerichtliche Schutzmaßnahmen prüfen</text><rect x="72" y="1149" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1182" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1214" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Erziehungs- und Aufsichtsrecht rechtfertigen keine Gewalt.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
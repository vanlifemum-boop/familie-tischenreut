<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 1666 und 1666a BGB: Gerichtliche Maßnahmen bei Kindeswohlgefährdung und Verhältnismäßigkeit</title><desc id="desc">Das Familiengericht prüft eine Gefahr für das Kind. Akute Gefahr und Eilschutz sofort klären; Konkrete Gefahrenannahmen und Belege zuordnen; Verfügbare mildere Hilfen nachvollziehbar darstellen; Anhörung und genau betroffene Sorgebereiche prüfen; Frist, Änderung und Aufhebung gezielt prüfen. Trennung nur, wenn die Gefahr nicht durch mildere Mittel abwendbar ist.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 51 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 1666 und 1666a BGB</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Gerichtliche Maßnahmen bei Kindeswohlgefährdung</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">und Verhältnismäßigkeit</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Das Familiengericht prüft eine Gefahr für das Kind.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="552.0" r="30" fill="#142943"/><text x="122" y="563.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="562.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Akute Gefahr und Eilschutz sofort klären</text><rect x="72" y="623" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="679.0" r="30" fill="#142943"/><text x="122" y="690.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="689.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Konkrete Gefahrenannahmen und Belege zuordnen</text><rect x="72" y="750" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="808.0" r="30" fill="#142943"/><text x="122" y="819.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="798.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Verfügbare mildere Hilfen nachvollziehbar</text><text x="182" y="838.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">darstellen</text><rect x="72" y="881" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="939.0" r="30" fill="#142943"/><text x="122" y="950.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="929.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Anhörung und genau betroffene Sorgebereiche</text><text x="182" y="969.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="1012" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1068.0" r="30" fill="#142943"/><text x="122" y="1079.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1078.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Frist, Änderung und Aufhebung gezielt prüfen</text><rect x="72" y="1157" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1190" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1222" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Trennung nur, wenn die Gefahr nicht durch mildere Mittel abwendbar ist.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Art. 13 und 14 EMRK: Wirksame Beschwerde und Schutz vor Diskriminierung</title><desc id="desc">Rechtsschutz oder diskriminierende Behandlung werden beanstandet. Betroffenes EMRK-Recht konkret benennen; Ungleichbehandlung und Folgen dokumentieren; Sachliche Gründe und Vergleich prüfen; Wirksamen nationalen Rechtsbehelf nutzen; Internationale Frist gesondert prüfen. Eine Aufsichtsbeschwerde wahrt gesetzliche Rechtsbehelfsfristen nicht automatisch.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 06 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">Art. 13 und 14 EMRK</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Wirksame Beschwerde und Schutz vor Diskriminierung</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Rechtsschutz oder diskriminierende Behandlung werden beanstandet.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="508.0" r="30" fill="#142943"/><text x="122" y="519.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="518.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Betroffenes EMRK-Recht konkret benennen</text><rect x="72" y="579" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="635.0" r="30" fill="#142943"/><text x="122" y="646.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="645.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Ungleichbehandlung und Folgen dokumentieren</text><rect x="72" y="706" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="762.0" r="30" fill="#142943"/><text x="122" y="773.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="772.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Sachliche Gründe und Vergleich prüfen</text><rect x="72" y="833" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="889.0" r="30" fill="#142943"/><text x="122" y="900.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="899.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Wirksamen nationalen Rechtsbehelf nutzen</text><rect x="72" y="960" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1016.0" r="30" fill="#142943"/><text x="122" y="1027.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1026.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Internationale Frist gesondert prüfen</text><rect x="72" y="1105" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1138" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1170" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Eine Aufsichtsbeschwerde wahrt gesetzliche Rechtsbehelfsfristen nicht</text><text x="96" y="1206" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">automatisch.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
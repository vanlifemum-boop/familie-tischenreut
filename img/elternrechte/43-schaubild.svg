<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 86 bis 88a SGB VIII: Örtliche Zuständigkeit des Jugendamts</title><desc id="desc">Ein Jugendamt verweist wegen eines Umzugs an eine andere Stelle. Leistung, Beginn, Aufenthalte und Sorgeunterlagen zusammenstellen; Konkrete Zuständigkeitsregel benennen lassen; Fortführung bis zur Übernahme nach § 86c ansprechen; Bei Unklarheit vorläufiges Tätigwerden nach § 86d prüfen; Übergabe, Beteiligung und Ansprechpartner festhalten. Zuständigkeit folgt nicht immer dem Wohnort des Kindes; verschiedene Aufgaben haben eigene Regeln.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 43 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 86 bis 88a SGB VIII</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Örtliche Zuständigkeit des Jugendamts</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Ein Jugendamt verweist wegen eines Umzugs an eine andere Stelle.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="510.0" r="30" fill="#142943"/><text x="122" y="521.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="500.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Leistung, Beginn, Aufenthalte und Sorgeunterlagen</text><text x="182" y="540.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">zusammenstellen</text><rect x="72" y="583" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="639.0" r="30" fill="#142943"/><text x="122" y="650.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="649.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Konkrete Zuständigkeitsregel benennen lassen</text><rect x="72" y="710" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="768.0" r="30" fill="#142943"/><text x="122" y="779.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="758.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Fortführung bis zur Übernahme nach § 86c</text><text x="182" y="798.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">ansprechen</text><rect x="72" y="841" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="899.0" r="30" fill="#142943"/><text x="122" y="910.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="889.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bei Unklarheit vorläufiges Tätigwerden nach § 86d</text><text x="182" y="929.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="972" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1030.0" r="30" fill="#142943"/><text x="122" y="1041.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1020.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Übergabe, Beteiligung und Ansprechpartner</text><text x="182" y="1060.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">festhalten</text><rect x="72" y="1121" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1154" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1186" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Zuständigkeit folgt nicht immer dem Wohnort des Kindes; verschiedene</text><text x="96" y="1222" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Aufgaben haben eigene Regeln.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
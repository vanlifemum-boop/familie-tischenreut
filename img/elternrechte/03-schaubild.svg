<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Art. 19 Abs. 4, Art. 20 Abs. 3 und Art. 103 Abs. 1 GG: Rechtsstaat, wirksamer Rechtsschutz und rechtliches Gehör</title><desc id="desc">Entscheidendes Vorbringen wurde möglicherweise übergangen. Entscheidung und Zustellungsdatum sichern; Übergangenen Punkt und Bedeutung benennen; Aktenzugang und Äußerungsmöglichkeit prüfen; Statthaften Rechtsbehelf sofort bestimmen; Form, Frist und Eilrechtsschutz sichern. Eine Sachstandsanfrage ersetzt keine fristgerechte Anhörungsrüge.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 03 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">Art. 19 Abs. 4, Art. 20 Abs. 3 und Art.</text><text x="72" y="182" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">103 Abs. 1 GG</text><text x="72" y="250" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Rechtsstaat, wirksamer Rechtsschutz und rechtliches</text><text x="72" y="294" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Gehör</text><line x1="72" x2="1128" y1="363" y2="363" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="411" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="447" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Entscheidendes Vorbringen wurde möglicherweise übergangen.</text><text x="72" y="511" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="554" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="610.0" r="30" fill="#142943"/><text x="122" y="621.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="620.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Entscheidung und Zustellungsdatum sichern</text><rect x="72" y="681" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="737.0" r="30" fill="#142943"/><text x="122" y="748.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="747.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Übergangenen Punkt und Bedeutung benennen</text><rect x="72" y="808" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="864.0" r="30" fill="#142943"/><text x="122" y="875.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="874.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Aktenzugang und Äußerungsmöglichkeit prüfen</text><rect x="72" y="935" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="991.0" r="30" fill="#142943"/><text x="122" y="1002.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="1001.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Statthaften Rechtsbehelf sofort bestimmen</text><rect x="72" y="1062" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1118.0" r="30" fill="#142943"/><text x="122" y="1129.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1128.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Form, Frist und Eilrechtsschutz sichern</text><rect x="72" y="1207" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1240" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1272" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Eine Sachstandsanfrage ersetzt keine fristgerechte Anhörungsrüge.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
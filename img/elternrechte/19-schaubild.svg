<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 5 SGB VIII: Wunsch- und Wahlrecht bei Jugendhilfeleistungen</title><desc id="desc">Du möchtest einen anderen Anbieter oder eine andere Hilfeausgestaltung. Gewünschtes Angebot oder Änderung genau benennen; Eignung, Verfügbarkeit und besondere Bedürfnisse darlegen; Wunsch im Hilfeplangespräch aufnehmen lassen; Ablehnungsgrund und gegebenenfalls Kostenvergleich erfragen; Kostenübernahme vor privater Beauftragung klären. Wunsch- und Wahlrecht garantiert nicht jeden Anbieter oder jede Fachkraft.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 19 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 5 SGB VIII</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Wunsch- und Wahlrecht bei Jugendhilfeleistungen</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Du möchtest einen anderen Anbieter oder eine andere Hilfeausgestaltung.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="510.0" r="30" fill="#142943"/><text x="122" y="521.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="500.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Gewünschtes Angebot oder Änderung genau</text><text x="182" y="540.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">benennen</text><rect x="72" y="583" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="641.0" r="30" fill="#142943"/><text x="122" y="652.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="631.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Eignung, Verfügbarkeit und besondere Bedürfnisse</text><text x="182" y="671.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">darlegen</text><rect x="72" y="714" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="770.0" r="30" fill="#142943"/><text x="122" y="781.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="780.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Wunsch im Hilfeplangespräch aufnehmen lassen</text><rect x="72" y="841" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="899.0" r="30" fill="#142943"/><text x="122" y="910.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="889.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Ablehnungsgrund und gegebenenfalls</text><text x="182" y="929.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kostenvergleich erfragen</text><rect x="72" y="972" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1028.0" r="30" fill="#142943"/><text x="122" y="1039.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1038.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kostenübernahme vor privater Beauftragung klären</text><rect x="72" y="1117" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1150" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1182" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Wunsch- und Wahlrecht garantiert nicht jeden Anbieter oder jede Fachkraft.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
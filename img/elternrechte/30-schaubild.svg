<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 31 SGB VIII: Sozialpädagogische Familienhilfe</title><desc id="desc">Alltag und Erziehungsaufgaben brauchen intensive Familienhilfe. Belastungen und vorhandene Stärken konkret benennen; Geeignete Familienhilfe und Mitarbeit besprechen; Auftrag, Termine und Ziele im Hilfeplan klären; Hausbesuche, Datenschutz und Berichte transparent regeln; Fortschritte und notwendigen Umfang regelmäßig prüfen. SPFH ist Hilfe zur Selbsthilfe; § 31 schafft keine pauschale Betretungsbefugnis.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 30 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 31 SGB VIII</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Sozialpädagogische Familienhilfe</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Alltag und Erziehungsaufgaben brauchen intensive Familienhilfe.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="510.0" r="30" fill="#142943"/><text x="122" y="521.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="500.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Belastungen und vorhandene Stärken konkret</text><text x="182" y="540.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">benennen</text><rect x="72" y="583" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="639.0" r="30" fill="#142943"/><text x="122" y="650.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="649.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Geeignete Familienhilfe und Mitarbeit besprechen</text><rect x="72" y="710" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="766.0" r="30" fill="#142943"/><text x="122" y="777.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="776.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Auftrag, Termine und Ziele im Hilfeplan klären</text><rect x="72" y="837" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="895.0" r="30" fill="#142943"/><text x="122" y="906.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="885.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Hausbesuche, Datenschutz und Berichte transparent</text><text x="182" y="925.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">regeln</text><rect x="72" y="968" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1026.0" r="30" fill="#142943"/><text x="122" y="1037.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1016.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Fortschritte und notwendigen Umfang regelmäßig</text><text x="182" y="1056.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="1117" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1150" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1182" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">SPFH ist Hilfe zur Selbsthilfe; § 31 schafft keine pauschale</text><text x="96" y="1218" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Betretungsbefugnis.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
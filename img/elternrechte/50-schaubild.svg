<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 1632 BGB: Herausgabe, Umgangsbestimmung und Verbleibensanordnung</title><desc id="desc">Herausgabe oder Verbleib in der Pflegefamilie sind streitig. Sorgeumfang und bestehende Beschlüsse feststellen; Herausgabe, Verbleib und Umgang unterscheiden; Bindungen und konkrete Wegnahmegefahr prüfen; Geeignete Hilfen und Übergang nachvollziehbar planen; Passenden Antrag und bei Bedarf Eilschutz klären. Pflegepersonen-Umgang folgt gegebenenfalls § 1685, nicht § 1632.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 50 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 1632 BGB</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Herausgabe, Umgangsbestimmung und</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Verbleibensanordnung</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Herausgabe oder Verbleib in der Pflegefamilie sind streitig.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="554.0" r="30" fill="#142943"/><text x="122" y="565.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="544.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Sorgeumfang und bestehende Beschlüsse</text><text x="182" y="584.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">feststellen</text><rect x="72" y="627" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="683.0" r="30" fill="#142943"/><text x="122" y="694.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="693.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Herausgabe, Verbleib und Umgang unterscheiden</text><rect x="72" y="754" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="810.0" r="30" fill="#142943"/><text x="122" y="821.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="820.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bindungen und konkrete Wegnahmegefahr prüfen</text><rect x="72" y="881" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="939.0" r="30" fill="#142943"/><text x="122" y="950.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="929.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Geeignete Hilfen und Übergang nachvollziehbar</text><text x="182" y="969.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">planen</text><rect x="72" y="1012" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1068.0" r="30" fill="#142943"/><text x="122" y="1079.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1078.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Passenden Antrag und bei Bedarf Eilschutz klären</text><rect x="72" y="1157" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1190" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1222" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Pflegepersonen-Umgang folgt gegebenenfalls § 1685, nicht § 1632.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
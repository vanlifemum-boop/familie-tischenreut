<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 32 bis 35 SGB VIII: Tagesgruppe, Vollzeitpflege, Heimerziehung und intensive Einzelbetreuung</title><desc id="desc">Tagesgruppe, Pflegefamilie oder eine andere intensive Hilfe wird erwogen. Rechtsgrundlage: Hilfe, Inobhutnahme oder Beschluss klären; Bedarf und geeignete Hilfeformen einzeln vergleichen; Kind, Eltern und wichtige Bindungen einbeziehen; Auftrag, Kontakte und Entwicklungsperspektive festhalten; Eignung, Rückkehrmöglichkeiten und Alternativen überprüfen. Die vier Hilfeformen sind keine automatische Stufenleiter und übertragen nicht pauschal das Sorgerecht.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 31 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 32 bis 35 SGB VIII</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Tagesgruppe, Vollzeitpflege, Heimerziehung und</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">intensive Einzelbetreuung</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Tagesgruppe, Pflegefamilie oder eine andere intensive Hilfe wird erwogen.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="554.0" r="30" fill="#142943"/><text x="122" y="565.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="544.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Rechtsgrundlage: Hilfe, Inobhutnahme oder</text><text x="182" y="584.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Beschluss klären</text><rect x="72" y="627" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="685.0" r="30" fill="#142943"/><text x="122" y="696.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="675.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bedarf und geeignete Hilfeformen einzeln</text><text x="182" y="715.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">vergleichen</text><rect x="72" y="758" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="814.0" r="30" fill="#142943"/><text x="122" y="825.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="824.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kind, Eltern und wichtige Bindungen einbeziehen</text><rect x="72" y="885" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="943.0" r="30" fill="#142943"/><text x="122" y="954.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="933.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Auftrag, Kontakte und Entwicklungsperspektive</text><text x="182" y="973.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">festhalten</text><rect x="72" y="1016" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1074.0" r="30" fill="#142943"/><text x="122" y="1085.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1064.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Eignung, Rückkehrmöglichkeiten und Alternativen</text><text x="182" y="1104.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">überprüfen</text><rect x="72" y="1165" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1198" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1230" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Die vier Hilfeformen sind keine automatische Stufenleiter und übertragen</text><text x="96" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">nicht pauschal das Sorgerecht.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
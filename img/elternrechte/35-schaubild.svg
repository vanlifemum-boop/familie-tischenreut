<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 37 bis 37c SGB VIII: Zusammenarbeit, Elternberatung und Perspektivklärung bei Hilfe außerhalb der Familie</title><desc id="desc">Dein Kind lebt in einer Pflegefamilie oder Einrichtung. Beratung und Unterstützung für Eltern konkret ansprechen; Kontakte und Zusammenarbeit kindgerecht planen; Rückkehrbedingungen und mögliche andere Perspektive klären; Beschwerdewege und Schutzkonzept des Kindes erfragen; Ziele, Leistungen und Überprüfung im Hilfeplan festhalten. Eine Rückkehr folgt nicht automatisch; Kindeswohl und Gerichtsentscheidungen beachten.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 35 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 37 bis 37c SGB VIII</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Zusammenarbeit, Elternberatung und</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Perspektivklärung bei Hilfe außerhalb der Familie</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Dein Kind lebt in einer Pflegefamilie oder Einrichtung.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="554.0" r="30" fill="#142943"/><text x="122" y="565.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="544.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Beratung und Unterstützung für Eltern konkret</text><text x="182" y="584.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">ansprechen</text><rect x="72" y="627" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="683.0" r="30" fill="#142943"/><text x="122" y="694.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="693.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kontakte und Zusammenarbeit kindgerecht planen</text><rect x="72" y="754" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="812.0" r="30" fill="#142943"/><text x="122" y="823.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="802.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Rückkehrbedingungen und mögliche andere</text><text x="182" y="842.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Perspektive klären</text><rect x="72" y="885" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="943.0" r="30" fill="#142943"/><text x="122" y="954.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="933.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Beschwerdewege und Schutzkonzept des Kindes</text><text x="182" y="973.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">erfragen</text><rect x="72" y="1016" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1074.0" r="30" fill="#142943"/><text x="122" y="1085.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1064.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Ziele, Leistungen und Überprüfung im Hilfeplan</text><text x="182" y="1104.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">festhalten</text><rect x="72" y="1165" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1198" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1230" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Eine Rückkehr folgt nicht automatisch; Kindeswohl und</text><text x="96" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Gerichtsentscheidungen beachten.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
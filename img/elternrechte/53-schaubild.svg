<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 1684 bis 1686a BGB: Umgang, Bezugspersonen und Auskunft über das Kind</title><desc id="desc">Kontakt oder Informationen über ein Kind fehlen. Personengruppe und konkretes Anliegen bestimmen; Beschlüsse, Kontakte und Schutzbedarf erfassen; Passende Umgangs- oder Auskunftsgrundlage wählen; Kindgerechte Regelung konkret vorschlagen; Bei Bedarf Änderung, Durchsetzung oder Eilschutz prüfen. Unterschiedliche Bezugspersonen haben unterschiedliche Voraussetzungen.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 53 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 1684 bis 1686a BGB</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Umgang, Bezugspersonen und Auskunft über das Kind</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Kontakt oder Informationen über ein Kind fehlen.</text><text x="72" y="409" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="452" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="508.0" r="30" fill="#142943"/><text x="122" y="519.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="518.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Personengruppe und konkretes Anliegen bestimmen</text><rect x="72" y="579" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="635.0" r="30" fill="#142943"/><text x="122" y="646.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="645.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Beschlüsse, Kontakte und Schutzbedarf erfassen</text><rect x="72" y="706" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="764.0" r="30" fill="#142943"/><text x="122" y="775.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="754.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Passende Umgangs- oder Auskunftsgrundlage</text><text x="182" y="794.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">wählen</text><rect x="72" y="837" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="893.0" r="30" fill="#142943"/><text x="122" y="904.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="903.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kindgerechte Regelung konkret vorschlagen</text><rect x="72" y="964" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1022.0" r="30" fill="#142943"/><text x="122" y="1033.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1012.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bei Bedarf Änderung, Durchsetzung oder Eilschutz</text><text x="182" y="1052.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="1113" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1146" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1178" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Unterschiedliche Bezugspersonen haben unterschiedliche Voraussetzungen.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
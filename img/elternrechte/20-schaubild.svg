<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 8 SGB VIII: Beteiligung und Beratung von Kindern und Jugendlichen</title><desc id="desc">Eine Entscheidung betrifft dein Kind; seine Sicht bleibt unklar. Konkrete Entscheidung und Beteiligungsbedarf benennen; Altersgerechte Information und Gesprächsform erfragen; Sicht des Kindes ohne Druck oder Einüben von Antworten achten; Nachvollziehbare Berücksichtigung der Kindesmeinung klären; Bei Lücken passende Beteiligung und Unterstützung anregen. Beteiligung bedeutet weder alleinige Entscheidung noch vollständige Offenlegung vertraulicher Gespräche.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 20 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 8 SGB VIII</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Beteiligung und Beratung von Kindern und</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Jugendlichen</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine Entscheidung betrifft dein Kind; seine Sicht bleibt unklar.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="554.0" r="30" fill="#142943"/><text x="122" y="565.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="544.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Konkrete Entscheidung und Beteiligungsbedarf</text><text x="182" y="584.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">benennen</text><rect x="72" y="627" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="685.0" r="30" fill="#142943"/><text x="122" y="696.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="675.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Altersgerechte Information und Gesprächsform</text><text x="182" y="715.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">erfragen</text><rect x="72" y="758" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="816.0" r="30" fill="#142943"/><text x="122" y="827.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="806.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Sicht des Kindes ohne Druck oder Einüben von</text><text x="182" y="846.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Antworten achten</text><rect x="72" y="889" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="947.0" r="30" fill="#142943"/><text x="122" y="958.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="937.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Nachvollziehbare Berücksichtigung der</text><text x="182" y="977.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kindesmeinung klären</text><rect x="72" y="1020" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1078.0" r="30" fill="#142943"/><text x="122" y="1089.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1068.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Bei Lücken passende Beteiligung und Unterstützung</text><text x="182" y="1108.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">anregen</text><rect x="72" y="1169" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1202" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1234" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Beteiligung bedeutet weder alleinige Entscheidung noch vollständige</text><text x="96" y="1270" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Offenlegung vertraulicher Gespräche.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
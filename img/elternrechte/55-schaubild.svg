<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§§ 7, 13, 26 und 29 FamFG: Beteiligte, Akteneinsicht, Amtsermittlung und Beweise</title><desc id="desc">Beteiligung, Aktenzugang oder gerichtliche Tatsachenklärung fehlen. Eigene Stellung und Verfahrensart klären; Aktenzugang gezielt beim Gericht anfragen; Tatsachenfehler mit Seitenbezug und Belegen benennen; Erhebliche Ermittlungen konkret anregen; Stellungnahmemöglichkeit und Fristen sichern. Akteneinsicht ist kein unbegrenzter Zugang zu allen Familienakten.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 55 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§§ 7, 13, 26 und 29 FamFG</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Beteiligte, Akteneinsicht, Amtsermittlung und</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Beweise</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Beteiligung, Aktenzugang oder gerichtliche Tatsachenklärung fehlen.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="552.0" r="30" fill="#142943"/><text x="122" y="563.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="562.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Eigene Stellung und Verfahrensart klären</text><rect x="72" y="623" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="679.0" r="30" fill="#142943"/><text x="122" y="690.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="689.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Aktenzugang gezielt beim Gericht anfragen</text><rect x="72" y="750" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="808.0" r="30" fill="#142943"/><text x="122" y="819.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="798.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Tatsachenfehler mit Seitenbezug und Belegen</text><text x="182" y="838.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">benennen</text><rect x="72" y="881" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="937.0" r="30" fill="#142943"/><text x="122" y="948.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="947.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Erhebliche Ermittlungen konkret anregen</text><rect x="72" y="1008" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1064.0" r="30" fill="#142943"/><text x="122" y="1075.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1074.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Stellungnahmemöglichkeit und Fristen sichern</text><rect x="72" y="1153" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1186" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1218" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Akteneinsicht ist kein unbegrenzter Zugang zu allen Familienakten.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
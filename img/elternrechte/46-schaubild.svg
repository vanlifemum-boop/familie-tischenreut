<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 4 KKG: Mitteilungen von Berufsgeheimnisträgern bei Kindeswohlgefährdung</title><desc id="desc">Eine Fachkraft erwägt eine Kinderschutzmitteilung. Akute Gefahr sofort klären; Berufsgruppe und Anlass zuordnen; Gespräch, Hilfe und Beratung nachvollziehen; Erforderliche Übermittlung und Schutzgrenzen prüfen; Fehler mit Belegen richtigstellen. Elternzustimmung ist bei gesetzlich zulässiger Meldung nicht nötig.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 46 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 4 KKG</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Mitteilungen von Berufsgeheimnisträgern bei</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Kindeswohlgefährdung</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine Fachkraft erwägt eine Kinderschutzmitteilung.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="552.0" r="30" fill="#142943"/><text x="122" y="563.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="562.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Akute Gefahr sofort klären</text><rect x="72" y="623" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="679.0" r="30" fill="#142943"/><text x="122" y="690.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="689.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Berufsgruppe und Anlass zuordnen</text><rect x="72" y="750" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="806.0" r="30" fill="#142943"/><text x="122" y="817.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="816.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Gespräch, Hilfe und Beratung nachvollziehen</text><rect x="72" y="877" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="935.0" r="30" fill="#142943"/><text x="122" y="946.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="925.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Erforderliche Übermittlung und Schutzgrenzen</text><text x="182" y="965.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">prüfen</text><rect x="72" y="1008" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1064.0" r="30" fill="#142943"/><text x="122" y="1075.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1074.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Fehler mit Belegen richtigstellen</text><rect x="72" y="1153" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1186" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1218" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Elternzustimmung ist bei gesetzlich zulässiger Meldung nicht nötig.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
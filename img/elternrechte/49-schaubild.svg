<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">§ 1631b BGB: Freiheitsentziehende Unterbringung und Maßnahmen bei Minderjährigen</title><desc id="desc">Ein Kind wird geschlossen untergebracht oder festgehalten. Akuten Schutz und Rechtsstatus sofort klären; Art, Dauer und Wiederholung der Maßnahme erfassen; Gerichtlichen Beschluss und Umfang prüfen; Mildere Hilfen und aktuelle Gefahr konkret prüfen; Überprüfung und nötigen Eilrechtsschutz veranlassen. Elternzustimmung ersetzt keine erforderliche Gerichtsgenehmigung.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 49 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">§ 1631b BGB</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Freiheitsentziehende Unterbringung und Maßnahmen</text><text x="72" y="236" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">bei Minderjährigen</text><line x1="72" x2="1128" y1="305" y2="305" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="353" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="389" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Ein Kind wird geschlossen untergebracht oder festgehalten.</text><text x="72" y="453" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="496" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="552.0" r="30" fill="#142943"/><text x="122" y="563.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="562.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Akuten Schutz und Rechtsstatus sofort klären</text><rect x="72" y="623" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="681.0" r="30" fill="#142943"/><text x="122" y="692.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="671.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Art, Dauer und Wiederholung der Maßnahme</text><text x="182" y="711.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">erfassen</text><rect x="72" y="754" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="810.0" r="30" fill="#142943"/><text x="122" y="821.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="820.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Gerichtlichen Beschluss und Umfang prüfen</text><rect x="72" y="881" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="937.0" r="30" fill="#142943"/><text x="122" y="948.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="947.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Mildere Hilfen und aktuelle Gefahr konkret prüfen</text><rect x="72" y="1008" width="1056" height="116" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1066.0" r="30" fill="#142943"/><text x="122" y="1077.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1056.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Überprüfung und nötigen Eilrechtsschutz</text><text x="182" y="1096.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">veranlassen</text><rect x="72" y="1157" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1190" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1222" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Elternzustimmung ersetzt keine erforderliche Gerichtsgenehmigung.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Art. 2, 5 und 16 CEDAW: Diskriminierung von Frauen in Familie und Verfahren</title><desc id="desc">Eine familienbezogene Bewertung könnte auf Geschlechterstereotypen beruhen. Genaue Aussage und Folgen dokumentieren; Stereotype von Tatsachen unterscheiden; Individuelle Betreuung und Risiken belegen; Konkrete Aufklärung oder Korrektur anregen; Nationale Rechtsbehelfsfristen sichern. CEDAW begründet keinen automatischen Vorrang einer Mutter im Sorgestreit.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 14 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">Art. 2, 5 und 16 CEDAW</text><text x="72" y="192" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Diskriminierung von Frauen in Familie und Verfahren</text><line x1="72" x2="1128" y1="261" y2="261" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="309" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="345" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine familienbezogene Bewertung könnte auf Geschlechterstereotypen</text><text x="72" y="383" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">beruhen.</text><text x="72" y="447" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="490" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="546.0" r="30" fill="#142943"/><text x="122" y="557.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="556.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Genaue Aussage und Folgen dokumentieren</text><rect x="72" y="617" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="673.0" r="30" fill="#142943"/><text x="122" y="684.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="683.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Stereotype von Tatsachen unterscheiden</text><rect x="72" y="744" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="800.0" r="30" fill="#142943"/><text x="122" y="811.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="810.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Individuelle Betreuung und Risiken belegen</text><rect x="72" y="871" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="927.0" r="30" fill="#142943"/><text x="122" y="938.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="937.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Konkrete Aufklärung oder Korrektur anregen</text><rect x="72" y="998" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1054.0" r="30" fill="#142943"/><text x="122" y="1065.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1064.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Nationale Rechtsbehelfsfristen sichern</text><rect x="72" y="1143" width="1056" height="147" rx="14" fill="#f7eddb"/><text x="96" y="1176" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1208" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">CEDAW begründet keinen automatischen Vorrang einer Mutter im</text><text x="96" y="1244" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Sorgestreit.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Verordnung (EU) 2019/1111 – Brüssel IIb: Elterliche Verantwortung in grenzüberschreitenden EU-Fällen</title><desc id="desc">Eine Entscheidung über elterliche Verantwortung betrifft mehrere EU-Staaten. Teilnehmende Staaten und Verfahrensbeginn prüfen; Gewöhnlichen Aufenthalt und Zuständigkeit klären; Kindgerechte Beteiligung gewährleisten; Beschluss und passende Bescheinigung beschaffen; Vollstreckungsverfahren und Eilbedarf prüfen. Brüssel IIb gilt nicht für Dänemark und ersetzt kein materielles Sorgerecht.</desc><rect width="1200" height="1500" fill="#f5f7fa"/><rect width="1200" height="16" fill="#bc8a22"/><text x="72" y="62" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#8a590e">§§ ERKLÄRT  ·  THEMA 17 / 70</text><text x="72" y="124" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">Verordnung (EU) 2019/1111 – Brüssel</text><text x="72" y="182" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#142943">IIb</text><text x="72" y="250" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">Elterliche Verantwortung in grenzüberschreitenden</text><text x="72" y="294" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#142943">EU-Fällen</text><line x1="72" x2="1128" y1="363" y2="363" stroke="#ccd7e5" stroke-width="2"/><text x="72" y="411" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">DEINE SITUATION</text><text x="72" y="447" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">Eine Entscheidung über elterliche Verantwortung betrifft mehrere</text><text x="72" y="485" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#142943">EU-Staaten.</text><text x="72" y="549" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#316b99">MÖGLICHE NÄCHSTE SCHRITTE</text><rect x="72" y="592" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="648.0" r="30" fill="#142943"/><text x="122" y="659.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">1</text><text x="182" y="658.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Teilnehmende Staaten und Verfahrensbeginn prüfen</text><rect x="72" y="719" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="775.0" r="30" fill="#142943"/><text x="122" y="786.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">2</text><text x="182" y="785.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Gewöhnlichen Aufenthalt und Zuständigkeit klären</text><rect x="72" y="846" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="902.0" r="30" fill="#142943"/><text x="122" y="913.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">3</text><text x="182" y="912.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Kindgerechte Beteiligung gewährleisten</text><rect x="72" y="973" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1029.0" r="30" fill="#142943"/><text x="122" y="1040.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">4</text><text x="182" y="1039.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Beschluss und passende Bescheinigung beschaffen</text><rect x="72" y="1100" width="1056" height="112" rx="15" fill="#e8eef5" stroke="#cbd8e6" stroke-width="2"/><circle cx="122" cy="1156.0" r="30" fill="#142943"/><text x="122" y="1167.0" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="white">5</text><text x="182" y="1166.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#142943">Vollstreckungsverfahren und Eilbedarf prüfen</text><rect x="72" y="1245" width="1056" height="111" rx="14" fill="#f7eddb"/><text x="96" y="1278" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#715017">WICHTIGE GRENZE</text><text x="96" y="1310" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#402f18">Brüssel IIb gilt nicht für Dänemark und ersetzt kein materielles Sorgerecht.</text><text x="72" y="1429" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#56687a">systemfehlerfamilie.de  ·  Redaktionell geprüft: 26.10.2026</text><text x="72" y="1459" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#56687a">Vereinfachte Orientierung. Voraussetzungen und Quellen im Artikel lesen.</text></svg>